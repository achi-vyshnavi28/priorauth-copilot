# Full local stack: API + PostgreSQL (cases, decisions, audit) + MongoDB (clinical documents).
# Set PRIORAUTH_S3_BUCKET and AWS credentials in your shell to store attachments in S3.
services:
  api:
    build: .
    ports: ["8920:8920"]
    environment:
      PRIORAUTH_DB_URL: postgresql+psycopg://priorauth:priorauth@postgres:5432/priorauth
      PRIORAUTH_MONGO_URI: mongodb://mongo:27017
      PRIORAUTH_DEMO: "1"
      PRIORAUTH_EXTRACTOR: ${PRIORAUTH_EXTRACTOR:-keyword}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PRIORAUTH_S3_BUCKET: ${PRIORAUTH_S3_BUCKET:-}
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_started}
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: priorauth, POSTGRES_PASSWORD: priorauth, POSTGRES_DB: priorauth}
    healthcheck: {test: ["CMD", "pg_isready", "-U", "priorauth"], interval: 5s, retries: 10}
  mongo:
    image: mongo:7
